name = "DiscoveryKernels"
defaultTargets = ["Challenge", "R1_PSLQ", "R3_OV"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "R1_PSLQ"
# Explicit module list rather than a glob: `R1_PSLQ.Core` is committed
# work-in-progress that does not yet compile, and must not break CI. Restore
# the glob (`globs = ["R1_PSLQ.+"]`) once Core elaborates clean.
globs = ["R1_PSLQ.Defs", "R1_PSLQ.Empirical"]

[[lean_lib]]
name = "R3_OV"
globs = ["R3_OV.+"]
