name = "DiscoveryKernels"
defaultTargets = ["Challenge", "Conditioning", "R1_PSLQ", "R3_OV"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Conditioning"
# Explicit module list, not a glob: `Conditioning/CHALLENGE-COND.proposed.lean`
# is a proposal document (six by-design `sorry`s, and not a legal module name),
# and must not be elaborated as part of the library.
globs = ["Conditioning.Defs", "Conditioning.Gershgorin", "Conditioning.Margin",
         "Conditioning.Checker", "Conditioning.Sharpness", "Conditioning.Bridge"]

[[lean_lib]]
name = "R1_PSLQ"
globs = ["R1_PSLQ.+"]

[[lean_lib]]
name = "R3_OV"
globs = ["R3_OV.+"]
